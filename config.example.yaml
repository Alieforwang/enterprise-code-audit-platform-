# 企业级代码审计平台 - 配置示例
# 复制此文件为 config.yaml 并根据实际情况修改

# API 配置
api:
  provider: "openai"  # openai, deepseek, 或其他兼容 OpenAI API 的服务
  base_url: "https://api.openai.com/v1"
  api_key: "YOUR_API_KEY_HERE"  # 请替换为实际的 API Key
  model: "gpt-4-turbo-preview"  # 或 gpt-4, deepseek-v4-flash 等

# 运行配置
runtime:
  # 运行模式: "duration" (按时长) 或 "count" (按调用次数)
  mode: "count"
  # 调用次数限制（mode=count 时生效）
  call_limit: 100
  # 运行时长限制（秒）（mode=duration 时生效）
  duration_limit: 3600
  # 并发数
  concurrency: 3

# 代码库配置
codebase:
  # 代码库路径（留空则使用内置模拟数据）
  # 支持绝对路径或相对路径
  # 示例: "D:/projects/my-project" 或 "./my-project"
  path: ""
  
  # 文件排除规则（glob 模式）
  exclude:
    - "node_modules/**"
    - "venv/**"
    - "__pycache__/**"
    - ".git/**"
    - "*.pyc"
    - "*.pyo"
    - "dist/**"
    - "build/**"
    - "*.min.js"
    - "*.min.css"
    - "package-lock.json"
    - "yarn.lock"
  
  # 支持的文件扩展名
  extensions:
    - ".py"
    - ".js"
    - ".ts"
    - ".java"
    - ".go"
    - ".cpp"
    - ".c"
    - ".h"
    - ".cs"
    - ".rb"
    - ".php"
  
  # 模拟数据配置（path 为空时使用）
  mock:
    file_count: 50
    avg_tokens_per_file: 5000

# 场景配置
scenarios:
  code_review:
    enabled: true
    weight: 0.4  # 占总调用的 40%
    context_size: 100000  # 测试 100K tokens 上下文
  
  cross_file_analysis:
    enabled: true
    weight: 0.3  # 占总调用的 30%
    context_size: 200000  # 测试 200K tokens 上下文
  
  bug_fix_suggestion:
    enabled: true
    weight: 0.2  # 占总调用的 20%
    context_size: 50000
  
  logic_orchestration:
    enabled: true
    weight: 0.1  # 占总调用的 10%
    context_size: 300000  # 测试 300K tokens 上下文

# 日志配置
logging:
  output_dir: "./logs"
  log_level: "INFO"
  save_raw_logs: true
  generate_report: true
